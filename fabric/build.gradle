plugins {
    id "com.github.johnrengelman.shadow" version "7.1.2"
}

archivesBaseName = "${project.archives_base_name}-fabric"

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    mixin {
        defaultRefmapName = "lapisworks.fabric.refmap.json"
    }

    // Run configurations so the Fabric half of the port can actually be launched and tested, the
    // same way the NeoForge half is (a real dedicated server + client, not just a compile check).
    runs {
        server {
            server()
            setConfigName("Fabric Server")
            runDir "run"
        }
        client {
            client()
            setConfigName("Fabric Client")
            // The client needs its own game directory: Fabric Loader processes mods into a per-run
            // ".fabric/processedMods" cache and both sides writing it at once fails with
            // "The process cannot access the file because it is being used by another process".
            runDir "run-client"
            // Join the dev server straight away so an end-to-end run needs no menu interaction.
            programArgs "--username", "Tester",
                "--quickPlayMultiplayer", "127.0.0.1:25566"
        }
        configureEach {
            // Cross-platform sanity: these are the mod ids the pack provides.
            property "fabric.log.level", "info"
        }
    }
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin since it *excludes* files.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Hex Casting and its own Fabric stack.
    modImplementation("at.petra-k.hexcasting:hexcasting-fabric-${project.minecraft_version}:${project.hexcasting_version}") {
        exclude module: "phosphor"
        exclude module: "lithium"
    }
    modImplementation "at.petra-k:paucal:0.6.1-pre-7+1.20.1-fabric"
    modImplementation "vazkii.patchouli:Patchouli:${project.minecraft_version}-${project.patchouli_version}-FABRIC"

    // Accessories: Trinkets is the Fabric accessory API.
    modImplementation "dev.emi:trinkets:${project.trinkets_version}"

    // The reach attributes live in this Fabric-only mod (NeoForge uses Forge's own
    // ForgeMod.BLOCK_REACH / ENTITY_REACH instead), so it is a Fabric-side dependency only.
    // Jar-in-Jar'd because the shared code reads it unconditionally: without it the reach seam has
    // nothing to delegate to.
    modImplementation(include("com.jamieswhiteshirt:reach-entity-attributes:${project.reach_entity_attributes_version}"))

    // Cardinal Components: the Fabric per-entity data mechanism.
    modImplementation "dev.onyxstudios.cardinal-components-api:cardinal-components-base:${project.cca_version}"
    modImplementation "dev.onyxstudios.cardinal-components-api:cardinal-components-entity:${project.cca_version}"
    modImplementation "dev.onyxstudios.cardinal-components-api:cardinal-components-item:${project.cca_version}"
    modImplementation "dev.onyxstudios.cardinal-components-api:cardinal-components-block:${project.cca_version}"

    modApi("me.shedaniel.cloth:cloth-config-fabric:${project.clothconfig_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }

    modCompileOnly "dev.emi:emi-fabric:${project.emi_version}:api"
    modLocalRuntime "dev.emi:emi-fabric:${project.emi_version}"

    modCompileOnly "maven.modrinth:hextended-staves:${project.hextended_version}-fabric,1.20.1"
    modCompileOnly files("${rootProject.rootDir}/libs/hexpose-1.0.0.jar")

    // Runtime-only pieces needed to actually launch a Fabric dev server/client: Hex Casting's own
    // Fabric build requires these, so they must be present at runtime even though our code does not
    // compile against them.
    modLocalRuntime "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}"
    modLocalRuntime "com.samsthenerd.inline:inline-fabric:${project.inline_version}"
    // Hex Casting's Fabric build resolves SerializationHooks' BaseCustomIngredient while loading, so
    // it has to be on the runtime classpath (the released jar expects it Jar-in-Jar'd).
    modLocalRuntime "io.github.tropheusj:serialization-hooks:0.4.99999"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionFabric")) { transitive false }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowCommon]
    archiveClassifier.set "dev-shadow"
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier.set null
}

jar {
    archiveClassifier.set "dev"
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}
