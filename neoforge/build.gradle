plugins {
    id "com.github.johnrengelman.shadow" version "7.1.2"
}

archivesBaseName = "${project.archives_base_name}-neoforge"

architectury {
    platformSetupLoomIde()
    // For Minecraft 1.20.1 Architectury Loom still calls the NeoForge platform "forge"; only the
    // loader artifact differs (net.neoforged:forge instead of net.minecraftforge:forge).
    // See https://docs.architectury.dev/loom/using_neo
    forge()
}

loom {
    mixin {
        // The shared mixin configs live in common/ but are applied by this module too, so they all
        // need a refmap generated for the NeoForge (SRG) namespace.
        defaultRefmapName = "lapisworks.neoforge.refmap.json"
    }
    forge {
        // Every mixin config the NeoForge jar should load, including the ones shipped by common/.
        mixinConfig "lapisworks.mixins.json"
        mixinConfig "lapisworks.fulllapixical.mixins.json"
        mixinConfig "lapisworks.lapixical.mixins.json"
        mixinConfig "lapisworks.chariot.mixins.json"
        mixinConfig "lapisworks.lapisal.mixins.json"
        mixinConfig "lapisworks.lapiscessible.mixins.json"
        // NeoForge-only client mixins (e.g. attaching the collar's custom item renderer, which Forge
        // can only learn about from the item class itself).
        mixinConfig "lapisworks.neoforge.client.mixins.json"
    }
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
}

repositories {
    maven { url = "https://maven.theillusivec4.top" }
    maven {
        name = 'Kotlin for Forge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
    }
}

dependencies {
    // NeoForge for 1.20.1 is published as net.neoforged:forge and keeps net.minecraftforge.* packages.
    forge "net.neoforged:forge:${project.neoforge_version}"

    // Hex Casting and its own Forge-side stack. The hexisle pack ships the Forge builds of all of
    // these, so the NeoForge build links against the very same artifacts.
    modCompileOnly("at.petra-k.hexcasting:hexcasting-forge-${project.minecraft_version}:${project.hexcasting_version}") {
        transitive = false
    }
    modRuntimeOnly("at.petra-k.hexcasting:hexcasting-forge-${project.minecraft_version}:${project.hexcasting_version}") {
        transitive = false
    }
    modCompileOnly("at.petra-k.paucal:paucal-forge-${project.minecraft_version}:${project.paucal_version}") { transitive = false }
    modRuntimeOnly("at.petra-k.paucal:paucal-forge-${project.minecraft_version}:${project.paucal_version}") { transitive = false }
    modCompileOnly "vazkii.patchouli:Patchouli:${project.minecraft_version}-${project.patchouli_version}-FORGE"
    modRuntimeOnly "vazkii.patchouli:Patchouli:${project.minecraft_version}-${project.patchouli_version}-FORGE"

    // Accessories: Curios is the Forge/NeoForge accessory API, replacing Fabric's Trinkets.
    modCompileOnly("top.theillusivec4.curios:curios-forge:${project.curios_version}") { transitive = false }
    modRuntimeOnly("top.theillusivec4.curios:curios-forge:${project.curios_version}") { transitive = false }

    // Caelus is required by Hex Casting on the Forge side.
    modCompileOnly("top.theillusivec4.caelus:caelus-forge:3.2.0+1.20.1") { transitive = false }
    modRuntimeOnly("top.theillusivec4.caelus:caelus-forge:3.2.0+1.20.1") { transitive = false }

    modCompileOnly("com.samsthenerd.inline:inline-forge:${project.inline_version}") { transitive = false }
    modRuntimeOnly("com.samsthenerd.inline:inline-forge:${project.inline_version}") { transitive = false }

    modCompileOnly("me.shedaniel.cloth:cloth-config-forge:${project.clothconfig_version}") { transitive = false }
    modRuntimeOnly("me.shedaniel.cloth:cloth-config-forge:${project.clothconfig_version}") { transitive = false }

    // EMI publishes its Forge build only to Modrinth (maven.emi.dev is not reachable/valid for
    // this artifact), so pull it from the Modrinth maven instead of the dev.emi coordinate.
    modCompileOnly("maven.modrinth:emi:${project.emi_forge_version}") { transitive = false }
    modRuntimeOnly("maven.modrinth:emi:${project.emi_forge_version}") { transitive = false }

    // Kotlin runtime for Hex Casting's Forge build.
    modRuntimeOnly "thedarkcolour:kotlinforforge:4.12.0"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionForge")) { transitive = false }

    // NeoForge 1.20.1 does not bundle MixinExtras, but our mixins use @WrapMethod/@WrapOperation,
    // so it has to ride along inside the jar. Fabric Loader bundles its own, so only this module
    // needs the explicit dependency.
    modImplementation(include("io.github.llamalad7:mixinextras-forge:${project.mixin_extras_version}"))
}

processResources {
    inputs.property "version", project.version
    filesMatching("META-INF/mods.toml") {
        expand "version": project.version
    }
}

shadowJar {
    exclude "fabric.mod.json"
    exclude "lapisworks.fabric.mixins.json"
    configurations = [project.configurations.shadowCommon]
    archiveClassifier.set "dev-shadow"
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier.set null
}

jar {
    archiveClassifier.set "dev"
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}
