# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# gradle kotlin jvm plugin breaks without this
kotlin.stdlib.default.dependency=false

# needed for mixins to work for forge
asmVersion=9.4

# Minecraft / mappings. NOTE: Yarn is kept, because the whole codebase is written
# against Yarn names; Architectury Loom remaps per platform from here.
minecraft_version=1.20.1
yarn_mappings=1.20.1+build.10
loader_version=0.16.14

# Mod Properties
mod_version=1.7.0
maven_group=com.luxof.lapisworks
archives_base_name=lapisworks

# Multi-loader
# Architectury Loom names the 1.20.1 NeoForge platform "forge" (see docs.architectury.dev/loom/using_neo).
# This is build tooling only: no Architectury API artifact is needed at runtime.
enabledPlatforms=fabric,forge
# MixinExtras is bundled by Fabric Loader 0.16.x, but NeoForge 1.20.1 does not ship it,
# so the neoforge jar embeds it via Jar-in-Jar.
mixin_extras_version=0.4.1

# neoforge
# On 1.20.1 NeoForge publishes under net.neoforged:forge and keeps net.minecraftforge.* packages
# and the "forge" mod id.
neoforge_version=1.20.1-47.1.106

# Dependencies -- shared
hexcasting_version=0.11.4
# paucal's Forge artifact only exists as -pre-118 / -pre-5 on maven.blamejared.com
paucal_version=0.6.0-pre-118
patchouli_version=84.1
clothconfig_version=11.1.136
inline_version=1.20.1-1.2.2-12
emi_version=1.1.22+1.20.1
emi_forge_version=1.1.22+1.20.1+forge
trinkets_version=3.7.2
cca_version=5.2.3
curios_version=5.14.1+1.20.1

# Dependencies -- fabric only
fabric_version=0.92.6+1.20.1
fabric_kotlin_version=1.13.7+kotlin.2.2.21

# Dependencies -- interop (fabric artifacts; compile-only)
hextended_version=2.0.1
hexical_hexdoc_version=1.5.0
hierophantics_hexdoc_version=1.3.5
hierophantics_version=1.3.5
hexcessible_version=0.3.1
player_animator_version=1.0.2-rc1+1.20
vs2_version=2.4.0+75bf0ce873
vscore_version=1.1.0+7ec91c1e3a
reach_entity_attributes_version=2.4.0
